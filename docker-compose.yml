services:
  secretwish:
    build:
      context: .
      dockerfile: Dockerfile
    image: ariendev/secretwish:latest
    container_name: secretwish
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/secretwish.db
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-very-secure-random-string-at-least-32-chars}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - PORT=3000
      - UPLOAD_DIR=/app/public/uploads
      - SEED_DEMO=${SEED_DEMO:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-SecretWish <noreply@example.com>}
    volumes:
      - secretwish_data:/app/data
      - secretwish_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  secretwish_data:
  secretwish_uploads:
